{% extends "base.html" %}

{% block content %}
<div class="auth-container">
    <h2>회원가입</h2>

    <form method="post" class="auth-form">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit">가입하기</button>
    </form>

    <a href="{% url 'login' %}">
        이미 계정이 있으신가요?
    </a>
</div>
{% endblock %}
