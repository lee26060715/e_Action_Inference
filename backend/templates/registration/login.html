{% extends "base.html" %}

{% block content %}
<div class="auth-container">
    <h2>로그인</h2>

    <form method="post" class="auth-form">
        {% csrf_token %}
        {{ form.as_p }}

        {% if next %}
            <input type="hidden" name="next" value="{{ next }}">
        {% endif %}

        <button type="submit">로그인</button>
    </form>

    <a href="{% url 'accounts:signup' %}">
        회원가입하기
    </a>
</div>
{% endblock %}
